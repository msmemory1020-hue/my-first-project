<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #f6f7f9; font-family: "IBM Plex Sans KR", "WenQuanYi Zen Hei", sans-serif; color: #14171c; }
  .card { position: absolute; inset: 0; padding: 40px 56px 36px; display: flex; flex-direction: column; gap: 22px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
  .eyebrow { font-size: 22px; font-weight: 500; color: #23497a; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; flex: 1; }
  .box { background: #fff; border: 2px solid #dde1e7; border-radius: 20px; padding: 18px 28px 22px; display: flex; flex-direction: column; align-items: flex-start; }
  .box svg { width: 100%; height: 200px; display: block; }
  .who { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 700; margin-top: 2px; }
  .sw { width: 16px; height: 16px; border-radius: 4px; }
  .num { font-size: 76px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .num small { font-size: 28px; font-weight: 500; margin-left: 6px; }
  .sub { font-size: 20px; color: #4a515c; margin-top: 2px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 20px; color: #4a515c; }
  .gapline { font-size: 30px; font-weight: 700; color: #14171c; }
  .gapline b { color: #23497a; }
</style></head>
<body><div class="card">
  <div class="top"><h1>기아 EV5 vs 테슬라 모델Y</h1><span class="eyebrow">천안 등록 · 보조금 반영 실구매가</span></div>
  <div class="row">
    <div class="box">
      <!-- 박스형 SUV 옆모습 (직접 그린 일러스트) -->
      <svg viewBox="0 0 470 200" aria-hidden="true">
        <ellipse cx="235" cy="186" rx="210" ry="9" fill="#14171c" opacity="0.10"/>
        <path d="M30 152 L28 120 Q30 104 50 100 L122 92 L166 50 Q170 46 178 46 L398 44 Q408 44 414 50 L430 66 L434 108 L438 152 L397 152 A43 43 0 0 0 311 152 L149 152 A43 43 0 0 0 63 152 Z" fill="#2a78d6"/>
        <path d="M142 88 L176 55 L262 53 L262 88 Z" fill="#1d2733"/>
        <path d="M272 53 L338 52 L338 88 L272 88 Z" fill="#1d2733"/>
        <path d="M348 52 L398 51 L414 66 L416 88 L348 88 Z" fill="#1d2733"/>

        <rect x="426" y="72" width="6" height="30" rx="2" fill="#d94a3a"/>
        <path d="M60 128 L430 128" stroke="#1f5fae" stroke-width="3"/>
        <circle cx="106" cy="152" r="34" fill="#22262c"/><circle cx="106" cy="152" r="19" fill="#c9ced6"/><circle cx="106" cy="152" r="6" fill="#22262c"/>
        <circle cx="354" cy="152" r="34" fill="#22262c"/><circle cx="354" cy="152" r="19" fill="#c9ced6"/><circle cx="354" cy="152" r="6" fill="#22262c"/>
      </svg>
      <div class="who"><i class="sw" style="background:#2a78d6"></i>EV5 롱레인지 에어</div>
      <div class="num">3,478<small>만 원</small></div>
      <div class="sub">차량가 4,603만 − 보조금 1,125만</div>
    </div>
    <div class="box">
      <!-- 패스트백 크로스오버 옆모습 (직접 그린 일러스트) -->
      <svg viewBox="0 0 470 200" aria-hidden="true">
        <ellipse cx="235" cy="186" rx="210" ry="9" fill="#14171c" opacity="0.10"/>
        <path d="M30 152 L28 124 Q30 110 52 106 L136 96 Q180 54 236 46 Q302 38 352 52 Q404 68 430 102 L438 152 L397 152 A43 43 0 0 0 311 152 L149 152 A43 43 0 0 0 63 152 Z" fill="#eb6834"/>
        <path d="M156 92 Q194 60 238 54 Q262 51 282 51 L282 92 Z" fill="#1d2733"/>
        <path d="M292 51 Q322 52 346 59 Q382 72 404 92 L292 92 Z" fill="#1d2733"/>
        <path d="M36 116 L62 112 L62 118 L38 122 Z" fill="#e8eef6"/>
        <path d="M420 98 L432 104 L432 110 L418 106 Z" fill="#9c2b1e"/>
        <path d="M60 130 L432 130" stroke="#c9531f" stroke-width="3"/>
        <circle cx="106" cy="152" r="34" fill="#22262c"/><circle cx="106" cy="152" r="19" fill="#c9ced6"/><circle cx="106" cy="152" r="6" fill="#22262c"/>
        <circle cx="354" cy="152" r="34" fill="#22262c"/><circle cx="354" cy="152" r="19" fill="#c9ced6"/><circle cx="354" cy="152" r="6" fill="#22262c"/>
      </svg>
      <div class="who"><i class="sw" style="background:#eb6834"></i>모델Y 프리미엄 RWD</div>
      <div class="num">4,653<small>만 원</small></div>
      <div class="sub">차량가 4,999만 − 보조금 346만</div>
    </div>
  </div>
  <div class="foot"><span class="gapline">EV5가 <b>최대 1,348만 원</b> 저렴</span><span>2026.11.22 기준 · 매일 갱신 · 차량 그림은 이해를 돕는 일러스트</span></div>
</div></body></html>
