<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #f6f7f9; font-family: "IBM Plex Sans KR", "WenQuanYi Zen Hei", sans-serif; color: #14171c; }
  .card { position: absolute; inset: 0; padding: 56px 64px; display: flex; flex-direction: column; gap: 28px; }
  .eyebrow { font-size: 24px; font-weight: 500; color: #23497a; letter-spacing: 0.04em; }
  h1 { font-size: 64px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .box { background: #fff; border: 2px solid #dde1e7; border-radius: 18px; padding: 28px 32px; display: flex; flex-direction: column; gap: 6px; }
  .who { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 700; }
  .sw { width: 18px; height: 18px; border-radius: 5px; }
  .num { font-size: 84px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .num small { font-size: 30px; font-weight: 500; margin-left: 6px; }
  .sub { font-size: 20px; color: #4a515c; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; font-size: 22px; color: #4a515c; }
  .gapline { font-size: 30px; font-weight: 700; color: #14171c; }
  .gapline b { color: #23497a; }
</style></head>
<body><div class="card">
  <div class="eyebrow">천안 등록 · 보조금 반영 실구매가</div>
  <h1>기아 EV5 vs 테슬라 모델Y</h1>
  <div class="row">
    <div class="box"><div class="who"><i class="sw" style="background:#2a78d6"></i>EV5 롱레인지 에어</div><div class="num">3,478<small>만 원</small></div><div class="sub">차량가 4,603만 − 보조금 1,125만</div></div>
    <div class="box"><div class="who"><i class="sw" style="background:#eb6834"></i>모델Y 프리미엄 RWD</div><div class="num">4,653<small>만 원</small></div><div class="sub">차량가 4,999만 − 보조금 346만</div></div>
  </div>
  <div class="foot"><span class="gapline">EV5가 <b>최대 1,348만 원</b> 저렴</span><span>2026.11.22 기준 · 매일 갱신</span></div>
</div></body></html>
