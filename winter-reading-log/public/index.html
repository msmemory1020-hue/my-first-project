<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>겨울방학 독서 기록장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a reading notebook — summary on top, tabs, then books grouped by level/subject, each with a 4-step status switch */
:root {
  --bg: #f3f6f4;
  --paper: #ffffff;
  --ink: #1d2a26;
  --muted: #5d6d67;
  --line: #d8e1dd;
  --board: #24594b;      /* chalkboard green accent */
  --board-soft: #e2eee9;
  --none: #8a9893;
  --bought: #b7791f;
  --bought-soft: #fbf0dc;
  --have: #2f6db3;
  --have-soft: #e1ecf8;
  --read: #2e8b57;
  --read-soft: #def3e6;
  --new: #c2416b;
  --f-display: "Jua", "Noto Sans KR", system-ui, sans-serif;
  --f-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a17; --paper: #1a2420; --ink: #e6efeb; --muted: #9fb0a9; --line: #2c3a35;
    --board: #7cc4ad; --board-soft: #1f3530; --none: #7d8c86;
    --bought: #e3a94a; --bought-soft: #3a2e17; --have: #7fb0ea; --have-soft: #1b2c40;
    --read: #6fcf97; --read-soft: #193726; --new: #f07ea1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a17; --paper: #1a2420; --ink: #e6efeb; --muted: #9fb0a9; --line: #2c3a35;
  --board: #7cc4ad; --board-soft: #1f3530; --none: #7d8c86;
  --bought: #e3a94a; --bought-soft: #3a2e17; --have: #7fb0ea; --have-soft: #1b2c40;
  --read: #6fcf97; --read-soft: #193726; --new: #f07ea1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--board); font-weight: 700; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 6vw, 38px); line-height: 1.15; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); }

.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.read b { color: var(--read); } .stat.have b { color: var(--have); } .stat.bought b { color: var(--bought); } .stat.none b { color: var(--none); }
.bar { grid-column: 1 / -1; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; transition: width .3s; }
.bar .r { background: var(--read); } .bar .h { background: var(--have); } .bar .b { background: var(--bought); }

.tabs { display: flex; gap: 8px; border-bottom: 2px solid var(--line); }
.tab { font: inherit; font-weight: 700; font-size: 16px; background: none; border: 0; color: var(--muted); padding: 10px 6px; margin-bottom: -2px; border-bottom: 3px solid transparent; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--board); border-bottom-color: var(--board); }
.tab small { font-weight: 500; font-size: 13px; margin-left: 4px; font-variant-numeric: tabular-nums; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 99px; padding: 5px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--board); border-color: var(--board); color: var(--paper); }

.note { margin: 0; font-size: 13px; color: var(--muted); background: var(--board-soft); border-radius: 8px; padding: 8px 12px; }

.lock { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.lock label { font-size: 14px; font-weight: 700; flex: 1 1 200px; }
.lock label small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.lock input { font: inherit; font-size: 18px; letter-spacing: .3em; width: 7.5em; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); text-align: center; }
.lock button { font: inherit; font-weight: 700; border: 0; border-radius: 8px; padding: 8px 16px; background: var(--board); color: var(--paper); cursor: pointer; }
.unlocked { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.unlocked button { font: inherit; font-size: 12px; background: none; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); padding: 2px 10px; cursor: pointer; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group h2 { font-family: var(--f-display); font-weight: 400; font-size: 20px; margin: 8px 0 0; display: flex; align-items: baseline; gap: 8px; }
.group h2 small { font-family: var(--f-body); font-size: 12px; color: var(--muted); }
.book { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.book[data-s="read"] { border-color: var(--read); }
.top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.title { font-weight: 700; font-size: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.book[data-s="read"] .title span { text-decoration: line-through; text-decoration-color: var(--read); text-decoration-thickness: 2px; }
.badge { font-size: 11px; font-weight: 700; color: var(--new); border: 1px solid var(--new); border-radius: 99px; padding: 0 7px; }
.sub { font-size: 13px; color: var(--muted); }
.done { font-size: 12px; color: var(--read); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--bg); border-radius: 10px; padding: 3px; }
.seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 7px 2px; cursor: pointer; white-space: nowrap; }
.seg button:hover:not(:disabled) { color: var(--ink); }
.seg button[aria-pressed="true"][data-v="none"] { background: var(--paper); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.seg button[aria-pressed="true"][data-v="bought"] { background: var(--bought-soft); color: var(--bought); font-weight: 700; }
.seg button[aria-pressed="true"][data-v="have"] { background: var(--have-soft); color: var(--have); font-weight: 700; }
.seg button[aria-pressed="true"][data-v="read"] { background: var(--read-soft); color: var(--read); font-weight: 700; }
.seg button:disabled { cursor: default; opacity: .55; }
button:focus-visible { outline: 2px solid var(--board); outline-offset: 2px; }
.empty { color: var(--muted); text-align: center; padding: 24px 0; margin: 0; }
footer { font-size: 12px; color: var(--muted); }
@media (max-width: 520px) { .summary { grid-template-columns: repeat(2, 1fr); } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">새 학년 준비 · 초등 3학년</div>
    <h1>겨울방학 독서 기록장</h1>
    <p class="lede">책마다 상태 버튼을 누르면 바로 저장됩니다. <b>새 추천</b> 표시는 이번에 추가한 책입니다.</p>
  </header>

  <section class="summary" aria-label="전체 진행 현황">
    <div class="stat read"><b id="c-read">0</b><span>다 읽음</span></div>
    <div class="stat have"><b id="c-have">0</b><span>집에 있음</span></div>
    <div class="stat bought"><b id="c-bought">0</b><span>구매함</span></div>
    <div class="stat none"><b id="c-none">0</b><span>아직 없음</span></div>
    <div class="bar" role="img" id="bar" aria-label="진행률"><i class="r"></i><i class="h"></i><i class="b"></i></div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" id="tab-novel" role="tab" data-tab="novel" aria-selected="true">소설책<small id="n-novel"></small></button>
    <button class="tab" id="tab-info" role="tab" data-tab="info" aria-selected="false">지식책<small id="n-info"></small></button>
  </div>
  <div class="filters" role="group" aria-label="상태로 보기">
    <button class="chip" id="f-all" data-f="all" aria-pressed="true">전체</button>
    <button class="chip" id="f-none" data-f="none" aria-pressed="false">아직 없음</button>
    <button class="chip" id="f-ready" data-f="ready" aria-pressed="false">읽을 준비됨 (구매·보유)</button>
    <button class="chip" id="f-read" data-f="read" aria-pressed="false">다 읽음</button>
  </div>
  <form class="lock" id="lock" hidden>
    <label for="code">가족 암호를 입력하면 체크할 수 있습니다<small>이 기기에서 한 번만 입력하면 됩니다. 암호가 없으면 보기만 가능합니다.</small></label>
    <input id="code" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••">
    <button type="submit">확인</button>
  </form>
  <div class="unlocked" id="unlocked" hidden>🔓 이 기기에서 체크할 수 있습니다 <button type="button" id="relock">암호 지우기</button></div>
  <p class="note" id="note">저장된 기록을 불러오는 중입니다…</p>
  <div id="list"></div>
  <footer>‘다 읽음’을 누르면 그날 날짜가 함께 기록됩니다. 출판사·판본은 바뀔 수 있으니 도서관에서 먼저 빌려 보셔도 좋습니다.</footer>
</div>

  {id:"k14",k:"info",g:"국어 · 수학 · 생각",t:"그리스 로마 신화 (만화)",a:"홍은영",n:1,d:"서양 고전의 바탕, 이야기 상식"},
  {id:"k12",k:"info",g:"잡지",t:"어린이과학동아",a:"동아사이언스"},
  {id:"k20",k:"info",g:"잡지",t:"개똥이네 놀이터",a:"보리",n:1,d:"동화·자연·놀이가 함께 실린 월간지"}
];
const STATES = [["none","아직 없음"],["bought","구매함"],["have","집에 있음"],["read","다 읽음"]];
const LABEL = Object.fromEntries(STATES);

const CODE_KEY = "reading-log-family-code";
let code = "", statuses = {}, loaded = false, tab = "novel", filter = "all";
try { code = localStorage.getItem(CODE_KEY) || ""; } catch (e) {}
const saving = new Set();
const $ = (id) => document.getElementById(id);

function st(id){ return (statuses[id] && statuses[id].status) || "none"; }
function setNote(msg){ const n = $("note"); n.textContent = msg || ""; n.hidden = !msg; }
function today(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmt(s){ const p = String(s).split("-"); return p.length===3 ? (+p[1])+"/"+(+p[2])+" 완독" : "완독"; }
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text!=null) e.textContent = text; return e; }

function render(){
  const c = {none:0,bought:0,have:0,read:0};
  BOOKS.forEach(b => c[st(b.id)]++);
  for (const k in c) $("c-"+k).textContent = c[k];
  const T = BOOKS.length, bar = $("bar").children;
  bar[0].style.width = (c.read/T*100)+"%"; bar[1].style.width = (c.have/T*100)+"%"; bar[2].style.width = (c.bought/T*100)+"%";
  $("bar").setAttribute("aria-label", "전체 "+T+"권 중 "+c.read+"권 읽음");
  ["novel","info"].forEach(k => {
    const all = BOOKS.filter(b => b.k===k), r = all.filter(b => st(b.id)==="read").length;
    $("n-"+k).textContent = r+"/"+all.length;
    $("tab-"+k).setAttribute("aria-selected", String(tab===k));
  });
  document.querySelectorAll(".chip").forEach(ch => ch.setAttribute("aria-pressed", String(ch.dataset.f===filter)));

  $("lock").hidden = !!code; $("unlocked").hidden = !code;
  const list = $("list"); list.replaceChildren();
  const shown = BOOKS.filter(b => b.k===tab).filter(b => {
    const s = st(b.id);
    return filter==="all" || (filter==="ready" ? (s==="bought"||s==="have") : s===filter);
  });
  if (!shown.length) { list.append(el("p","empty","이 조건에 맞는 책이 없습니다.")); return; }
  const groups = [];
  shown.forEach(b => { let g = groups.find(x => x.name===b.g); if(!g){ g={name:b.g,items:[]}; groups.push(g);} g.items.push(b); });
  groups.forEach(g => {
    const sec = el("section","group"), h = el("h2",null,g.name);
    h.append(el("small",null,g.items.length+"권"));
    sec.append(h);
    g.items.forEach(b => {
      const s = st(b.id), card = el("article","book"); card.dataset.s = s;
      const top = el("div","top"), meta = el("div","meta"), title = el("div","title");
      title.append(el("span",null,b.t)); if (b.n) title.append(el("span","badge","새 추천"));
      meta.append(title, el("div","sub", b.a + (b.d ? " · "+b.d : "")));
      top.append(meta);
      if (s==="read") top.append(el("span","done", statuses[b.id] && statuses[b.id].readOn ? fmt(statuses[b.id].readOn) : "완독"));
      const seg = el("div","seg"); seg.setAttribute("role","group"); seg.setAttribute("aria-label", b.t+" 상태");
      STATES.forEach(([v,label]) => {
        const btn = el("button",null,label); btn.type = "button"; btn.dataset.v = v; btn.dataset.id = b.id;
        btn.setAttribute("aria-pressed", String(s===v));
        btn.disabled = !loaded || saving.has(b.id);
        seg.append(btn);
      });
      card.append(top, seg); sec.append(card);
    });
    list.append(sec);
  });
}

async function choose(id, v){
  if (st(id)===v) return;
  const prev = statuses[id];
  const next = v==="read" ? {status:v, readOn: (prev && prev.status==="read" && prev.readOn) || today()} : {status:v};
  if (!code) { setNote("체크하려면 먼저 가족 암호를 입력해 주세요."); $("code").focus(); return; }
  statuses = Object.assign({}, statuses, {[id]: next});
  saving.add(id); render();
  try {
    const res = await post(Object.assign({id}, next));
    if (res.status === 401) { forget(); throw new Error("code"); }
    if (!res.ok) throw new Error("save");
    setNote("");
  } catch (e) {
    statuses = Object.assign({}, statuses, {[id]: prev});
    setNote(e.message === "code" ? "가족 암호가 바뀌었습니다. 새 암호를 다시 입력해 주세요." : "저장하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요.");
  }
  saving.delete(id); render();
}

function post(body){
  return fetch("/api/books", { method: "POST", headers: { "content-type": "application/json", "x-family-code": code }, body: JSON.stringify(body) });
}
function forget(){ code = ""; try { localStorage.removeItem(CODE_KEY); } catch (e) {} }

$("lock").addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("code").value.trim(); if (!v) return;
  code = v;
  try {
    const res = await post({verify: true});
    if (res.ok) { try { localStorage.setItem(CODE_KEY, v); } catch (e) {} $("code").value = ""; setNote("확인되었습니다. 이제 이 기기에서 체크할 수 있습니다."); }
    else { forget(); setNote(res.status === 401 ? "암호가 맞지 않습니다. 다시 확인해 주세요." : "확인하지 못했습니다. 잠시 후 다시 시도해 주세요."); }
  } catch (err) { forget(); setNote("확인하지 못했습니다. 인터넷 연결을 확인해 주세요."); }
  render();
});
$("relock").addEventListener("click", () => { forget(); setNote(""); render(); });

$("list").addEventListener("click", e => { const b = e.target.closest(".seg button"); if (b && !b.disabled) choose(b.dataset.id, b.dataset.v); });
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { tab = t.dataset.tab; render(); }));
document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => { filter = ch.dataset.f; render(); }));

render();

// Load records, then refresh every 30 s while the page is visible so family members see each other's checks.
async function load(){
  if (saving.size) return;
  try {
    const res = await fetch("/api/books", { cache: "no-store" });
    if (!res.ok) throw new Error();
    const data = await res.json();
    if (saving.size) return;
    statuses = data.statuses || {};
    if (!loaded) setNote("");
    loaded = true;
  } catch (e) {
    if (!loaded) { loaded = true; setNote("저장된 기록을 불러오지 못했습니다. 잠시 후 다시 열어 주세요."); }
  }
  render();
}
load();
setInterval(() => { if (document.visibilityState === "visible") load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
</script>
</body>
</html>
