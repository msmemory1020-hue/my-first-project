<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>겨울방학 독서 기록장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* 송담초 디자인 시스템 적용: 남색 헤더 띠 + 흰 배경, 1px 헤어라인 카드(그림자 없음), Pretendard, 상태는 카테고리 색으로 구분 */
:root {
  color-scheme: light;
  /* 원시 팔레트 (송담초 tokens/colors.css) */
  --navy-900:#12203f; --navy-800:#16294f; --navy-700:#1b3a6b; --navy-300:#7a93bc; --navy-200:#c3d0e4; --navy-100:#e7ecf5; --navy-50:#f4f7fc;
  --orange-700:#a83a09; --orange-500:#de5412; --orange-100:#fbe7dc; --orange-50:#fdf4ef;
  --green-700:#3f6b1f; --green-600:#558a2c; --green-100:#e9f2df; --green-50:#f4f8ef;
  --sky-600:#2c5c8c; --sky-500:#3c72a8; --sky-100:#e4edf6; --sky-50:#f2f7fb;
  --ink-900:#1f2229; --ink-700:#3f4450; --ink-500:#6a7080; --ink-400:#949aa8;
  --line-400:#c3c9d4; --line-300:#dde1e8; --line-200:#ebeef3;
  --white:#ffffff; --gray-50:#f7f8fa; --gray-100:#f1f3f7;
  /* 의미 별칭 */
  --text-title:var(--ink-900); --text-body:var(--ink-700); --text-muted:var(--ink-500); --text-subtle:var(--ink-400);
  --text-on-dark:var(--white);
  --surface-page:var(--white); --surface-soft:var(--gray-50); --surface-strong:var(--gray-100); --surface-brand:var(--navy-700); --surface-brand-soft:var(--navy-50);
  --border-hairline:var(--line-300); --border-soft:var(--line-200); --border-strong:var(--line-400); --border-focus:var(--navy-700);
  --action-primary:var(--navy-700); --action-primary-hover:var(--navy-800); --action-primary-press:var(--navy-900); --action-primary-disabled:var(--navy-200);
  /* 상태 색: 구매함=주황, 집에 있음=하늘, 다 읽음=초록 */
  --st-bought:var(--orange-700); --st-bought-bg:var(--orange-50); --st-bought-bar:var(--orange-500);
  --st-have:var(--sky-600); --st-have-bg:var(--sky-50); --st-have-bar:var(--sky-500);
  --st-read:var(--green-700); --st-read-bg:var(--green-50); --st-read-bar:var(--green-600);
  --font-sans:"Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, sans-serif;
  --radius-card:16px; --radius-button:10px; --radius-field:10px; --radius-full:9999px;
  --dur-fast:120ms; --dur-base:200ms; --ease:cubic-bezier(.2,.8,.2,1);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--surface-page); color: var(--text-body); font-family: var(--font-sans); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; word-break: keep-all; text-wrap: pretty; }
h1, h2 { margin: 0; color: var(--text-title); font-weight: 600; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
.lucide { width: 20px; height: 20px; flex: none; }

.band { background: var(--surface-brand); color: var(--text-on-dark); margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); }
.inner { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.band .inner { padding-block: 40px 36px; display: flex; flex-direction: column; gap: 8px; }
.overline { font-size: 11px; line-height: 1.3; letter-spacing: .08em; font-weight: 600; text-transform: uppercase; }
.band .overline { color: var(--navy-200); }
.band h1 { color: var(--text-on-dark); font-size: 32px; line-height: 1.3; letter-spacing: -.6px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.band h1 .lucide { width: 28px; height: 28px; }
.band p { color: var(--navy-100); font-size: 15px; }

main.inner { padding-block: 32px 64px; display: flex; flex-direction: column; gap: 24px; }

.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { border: 1px solid var(--border-hairline); border-radius: var(--radius-card); padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat b { font-size: 32px; line-height: 1.1; letter-spacing: -.6px; font-weight: 700; color: var(--text-title); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.stat span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line-400); }
.stat.read span::before { background: var(--st-read-bar); } .stat.have span::before { background: var(--st-have-bar); } .stat.bought span::before { background: var(--st-bought-bar); }
.bar { grid-column: 1 / -1; height: 8px; border-radius: var(--radius-full); background: var(--surface-strong); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; transition: width var(--dur-base) var(--ease); }
.bar .r { background: var(--st-read-bar); } .bar .h { background: var(--st-have-bar); } .bar .b { background: var(--st-bought-bar); }

.lock { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--surface-brand-soft); border: 1px solid var(--navy-200); border-radius: var(--radius-card); padding: 16px 20px; }
.lock .lucide { color: var(--action-primary); }
.lock label { font-size: 15px; font-weight: 600; color: var(--text-title); flex: 1 1 220px; line-height: 1.5; }
.lock label small { display: block; font-weight: 400; color: var(--text-muted); font-size: 13px; }
.lock input { font-size: 18px; letter-spacing: .3em; width: 7.5em; padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-field); background: var(--white); color: var(--text-title); text-align: center; }
.lock input:focus-visible { outline: none; border: 2px solid var(--border-focus); padding: 7px 11px; }
.btn { border: 0; border-radius: var(--radius-button); padding: 10px 18px; font-size: 15px; line-height: 1.25; font-weight: 600; background: var(--action-primary); color: var(--white); cursor: pointer; transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }
.btn:hover { background: var(--action-primary-hover); }
.btn:active { background: var(--action-primary-press); transform: scale(.985); }
.unlocked { font-size: 13px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.unlocked .lucide { width: 16px; height: 16px; color: var(--st-read); }
.unlocked button { font-size: 13px; background: var(--white); border: 1px solid var(--border-hairline); border-radius: var(--radius-full); color: var(--text-muted); padding: 2px 12px; cursor: pointer; }
.unlocked button:hover { background: var(--surface-soft); border-color: var(--border-strong); }

.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--border-hairline); }
.tab { background: none; border: 0; color: var(--text-muted); font-size: 18px; font-weight: 600; padding: 10px 0; margin-bottom: -1px; border-bottom: 2px solid transparent; cursor: pointer; transition: color var(--dur-fast) var(--ease); }
.tab:hover { color: var(--text-title); }
.tab[aria-selected="true"] { color: var(--action-primary); border-bottom-color: var(--action-primary); }
.tab small { font-weight: 500; font-size: 13px; margin-left: 6px; font-variant-numeric: tabular-nums; color: var(--text-muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: -8px; }
.chip { font-size: 14px; border: 1px solid var(--border-hairline); background: var(--white); color: var(--text-body); border-radius: var(--radius-full); padding: 6px 14px; cursor: pointer; transition: background var(--dur-fast) var(--ease); }
.chip:hover { background: var(--surface-soft); border-color: var(--border-strong); }
.chip[aria-pressed="true"] { background: var(--action-primary); border-color: var(--action-primary); color: var(--white); }

.note { font-size: 14px; color: var(--text-body); background: var(--surface-soft); border: 1px solid var(--border-soft); border-radius: var(--radius-button); padding: 10px 14px; }

.group { display: flex; flex-direction: column; gap: 12px; }
.group + .group { margin-top: 16px; }
.group h2 { font-size: 20px; line-height: 1.4; letter-spacing: -.2px; display: flex; align-items: baseline; gap: 8px; }
.group h2 small { font-size: 13px; font-weight: 400; color: var(--text-muted); }
.book { background: var(--white); border: 1px solid var(--border-hairline); border-radius: var(--radius-card); padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.book[data-s="read"] { background: var(--st-read-bg); border-color: var(--green-100); }
.top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.title { font-weight: 600; font-size: 16px; line-height: 1.5; color: var(--text-title); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.book[data-s="read"] .title span:first-child { text-decoration: line-through; text-decoration-color: var(--st-read-bar); text-decoration-thickness: 2px; }
.badge { font-size: 11px; line-height: 1.2; font-weight: 600; color: var(--navy-700); background: var(--navy-100); border-radius: var(--radius-full); padding: 3px 8px; }
.sub { font-size: 13px; line-height: 1.5; color: var(--text-muted); }
.done { font-size: 13px; color: var(--st-read); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface-strong); border-radius: var(--radius-button); padding: 3px; }
.seg button { font-size: 14px; border: 0; background: transparent; color: var(--text-muted); border-radius: 8px; padding: 8px 2px; cursor: pointer; white-space: nowrap; transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.seg button:hover:not(:disabled) { color: var(--text-title); background: var(--white); }
.seg button[aria-pressed="true"][data-v="none"] { background: var(--white); color: var(--text-title); box-shadow: inset 0 0 0 1px var(--border-hairline); }
.seg button[aria-pressed="true"][data-v="bought"] { background: var(--orange-100); color: var(--st-bought); font-weight: 600; }
.seg button[aria-pressed="true"][data-v="have"] { background: var(--sky-100); color: var(--st-have); font-weight: 600; }
.seg button[aria-pressed="true"][data-v="read"] { background: var(--green-100); color: var(--st-read); font-weight: 600; }
.seg button:disabled { cursor: not-allowed; color: var(--text-subtle); }
.empty { color: var(--text-muted); text-align: center; padding: 32px 0; }
footer { font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--border-soft); padding-top: 16px; }
@media (max-width: 560px) {
  .summary { grid-template-columns: repeat(2, 1fr); }
  .band .inner { padding-block: 28px 24px; }
  .band h1 { font-size: 26px; letter-spacing: -.4px; }
  .stat b { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="band">
  <div class="inner">
    <div class="overline">Reading Log · 새 학년 준비 초등 3학년</div>
    <h1><i data-lucide="book-open"></i>겨울방학 독서 기록장</h1>
    <p>책마다 상태 버튼을 누르면 바로 저장됩니다. ‘새 추천’ 표시는 최근에 추가한 책입니다.</p>
  </div>
</header>

<main class="inner">
  <section class="summary" aria-label="전체 진행 현황">
    <div class="stat read"><b id="c-read">0</b><span>다 읽음</span></div>
    <div class="stat have"><b id="c-have">0</b><span>집에 있음</span></div>
    <div class="stat bought"><b id="c-bought">0</b><span>구매함</span></div>
    <div class="stat none"><b id="c-none">0</b><span>아직 없음</span></div>
    <div class="bar" role="img" id="bar" aria-label="진행률"><i class="r"></i><i class="h"></i><i class="b"></i></div>
  </section>

  <form class="lock" id="lock" hidden>
    <i data-lucide="lock"></i>
    <label for="code">가족 암호를 입력하면 체크할 수 있습니다<small>이 기기에서 한 번만 입력하면 됩니다. 암호가 없으면 보기만 할 수 있습니다.</small></label>
    <input id="code" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="····">
    <button class="btn" type="submit">확인</button>
  </form>
  <div class="unlocked" id="unlocked" hidden><i data-lucide="lock-open"></i>이 기기에서 체크할 수 있습니다. <button type="button" id="relock">암호 지우기</button></div>

  <div class="tabs" role="tablist">
    <button class="tab" id="tab-novel" role="tab" data-tab="novel" aria-selected="true">소설책<small id="n-novel"></small></button>
    <button class="tab" id="tab-info" role="tab" data-tab="info" aria-selected="false">지식책<small id="n-info"></small></button>
  </div>
  <div class="filters" role="group" aria-label="상태로 보기">
    <button class="chip" id="f-all" data-f="all" aria-pressed="true">전체</button>
    <button class="chip" id="f-none" data-f="none" aria-pressed="false">아직 없음</button>
    <button class="chip" id="f-ready" data-f="ready" aria-pressed="false">읽을 준비됨 (구매·보유)</button>
    <button class="chip" id="f-read" data-f="read" aria-pressed="false">다 읽음</button>
  </div>
  <p class="note" id="note">불러오는 중입니다.</p>
  <div id="list"></div>
  <footer>‘다 읽음’을 누르면 그날 날짜가 함께 기록됩니다. 출판사·판본은 바뀔 수 있으니 도서관에서 먼저 빌려 보셔도 좋습니다.</footer>
</main>

  {id:"k01",k:"info",g:"과학",t:"신기한 스쿨버스",a:"조애너 콜"},
  {id:"k02",k:"info",g:"과학",t:"Why? 시리즈",a:"예림당"},
  {id:"k07",k:"info",g:"과학",t:"내일은 실험왕",a:"곰돌이 co."},
  {id:"k08",k:"info",g:"과학",t:"살아남기 시리즈",a:"곰돌이 co."},
  {id:"k06",k:"info",g:"과학",t:"세밀화로 그린 보리 어린이 도감",a:"보리"},
  {id:"k16",k:"info",g:"과학",t:"흔한남매 과학 탐험대",a:"아이휴먼",n:1,d:"인기 캐릭터와 함께 보는 과학 만화"},
  {id:"k17",k:"info",g:"과학",t:"내일은 발명왕",a:"곰돌이 co.",n:1,d:"생활 속 발명 원리, 만들기 활동 연계"},
  {id:"k19",k:"info",g:"과학",t:"우리 몸의 구멍",a:"허은미",n:1,d:"눈·코·입 등 몸의 구멍이 하는 일, 그림책"},
  {id:"k03",k:"info",g:"사회 · 역사 · 지리",t:"맵스(MAPS)",a:"미지엘린스키 부부"},
  {id:"k04",k:"info",g:"사회 · 역사 · 지리",t:"용선생 만화 한국사",a:"사회평론"},
  {id:"k05",k:"info",g:"사회 · 역사 · 지리",t:"설민석의 한국사 대모험",a:"아이휴먼"},
  {id:"k13",k:"info",g:"사회 · 역사 · 지리",t:"Who? 인물 시리즈",a:"다산어린이",n:1,d:"위인·인물 학습만화, 관심 인물부터"},
  {id:"k18",k:"info",g:"사회 · 역사 · 지리",t:"엄마는 해녀입니다",a:"고희영",n:1,d:"제주 해녀 이야기, 지역과 직업 이해"},
  {id:"k15",k:"info",g:"사회 · 역사 · 지리",t:"열두 살에 부자가 된 키라",a:"보도 섀퍼",n:1,d:"용돈·저축으로 배우는 경제, 부모님과 함께"},
  {id:"k09",k:"info",g:"국어 · 수학 · 생각",t:"수학탐정스",a:"조인하"},
  {id:"k10",k:"info",g:"국어 · 수학 · 생각",t:"마법천자문",a:"아울북"},
  {id:"k11",k:"info",g:"국어 · 수학 · 생각",t:"이게 정말 사과일까?",a:"요시타케 신스케"},
  {id:"k14",k:"info",g:"국어 · 수학 · 생각",t:"그리스 로마 신화 (만화)",a:"홍은영",n:1,d:"서양 고전의 바탕, 이야기 상식"},
  {id:"k12",k:"info",g:"잡지",t:"어린이과학동아",a:"동아사이언스"},
  {id:"k20",k:"info",g:"잡지",t:"개똥이네 놀이터",a:"보리",n:1,d:"동화·자연·놀이가 함께 실린 월간지"}
];
const STATES = [["none","아직 없음"],["bought","구매함"],["have","집에 있음"],["read","다 읽음"]];
const LABEL = Object.fromEntries(STATES);

const CODE_KEY = "reading-log-family-code";
let code = "", statuses = {}, loaded = false, tab = "novel", filter = "all";
try { code = localStorage.getItem(CODE_KEY) || ""; } catch (e) {}
const saving = new Set();
const $ = (id) => document.getElementById(id);

function st(id){ return (statuses[id] && statuses[id].status) || "none"; }
function setNote(msg){ const n = $("note"); n.textContent = msg || ""; n.hidden = !msg; }
function today(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmt(s){ const p = String(s).split("-"); return p.length===3 ? p.join(".")+" 완독" : "완독"; }
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text!=null) e.textContent = text; return e; }

function render(){
  const c = {none:0,bought:0,have:0,read:0};
  BOOKS.forEach(b => c[st(b.id)]++);
  for (const k in c) $("c-"+k).textContent = c[k];
  const T = BOOKS.length, bar = $("bar").children;
  bar[0].style.width = (c.read/T*100)+"%"; bar[1].style.width = (c.have/T*100)+"%"; bar[2].style.width = (c.bought/T*100)+"%";
  $("bar").setAttribute("aria-label", "전체 "+T+"권 중 "+c.read+"권 읽음");
  ["novel","info"].forEach(k => {
    const all = BOOKS.filter(b => b.k===k), r = all.filter(b => st(b.id)==="read").length;
    $("n-"+k).textContent = r+"/"+all.length;
    $("tab-"+k).setAttribute("aria-selected", String(tab===k));
  });
  document.querySelectorAll(".chip").forEach(ch => ch.setAttribute("aria-pressed", String(ch.dataset.f===filter)));

  $("lock").hidden = !!code; $("unlocked").hidden = !code;
  const list = $("list"); list.replaceChildren();
  const shown = BOOKS.filter(b => b.k===tab).filter(b => {
    const s = st(b.id);
    return filter==="all" || (filter==="ready" ? (s==="bought"||s==="have") : s===filter);
  });
  if (!shown.length) { list.append(el("p","empty","이 조건에 맞는 책이 없습니다.")); return; }
  const groups = [];
  shown.forEach(b => { let g = groups.find(x => x.name===b.g); if(!g){ g={name:b.g,items:[]}; groups.push(g);} g.items.push(b); });
  groups.forEach(g => {
    const sec = el("section","group"), h = el("h2",null,g.name);
    h.append(el("small",null,g.items.length+"권"));
    sec.append(h);
    g.items.forEach(b => {
      const s = st(b.id), card = el("article","book"); card.dataset.s = s;
      const top = el("div","top"), meta = el("div","meta"), title = el("div","title");
      title.append(el("span",null,b.t)); if (b.n) title.append(el("span","badge","새 추천"));
      meta.append(title, el("div","sub", b.a + (b.d ? " · "+b.d : "")));
      top.append(meta);
      if (s==="read") top.append(el("span","done", statuses[b.id] && statuses[b.id].readOn ? fmt(statuses[b.id].readOn) : "완독"));
      const seg = el("div","seg"); seg.setAttribute("role","group"); seg.setAttribute("aria-label", b.t+" 상태");
      STATES.forEach(([v,label]) => {
        const btn = el("button",null,label); btn.type = "button"; btn.dataset.v = v; btn.dataset.id = b.id;
        btn.setAttribute("aria-pressed", String(s===v));
        btn.disabled = !loaded || saving.has(b.id);
        seg.append(btn);
      });
      card.append(top, seg); sec.append(card);
    });
    list.append(sec);
  });
}

async function choose(id, v){
  if (st(id)===v) return;
  const prev = statuses[id];
  const next = v==="read" ? {status:v, readOn: (prev && prev.status==="read" && prev.readOn) || today()} : {status:v};
  if (!code) { setNote("체크하려면 먼저 가족 암호를 입력해 주세요."); $("code").focus(); return; }
  statuses = Object.assign({}, statuses, {[id]: next});
  saving.add(id); render();
  try {
    const res = await post(Object.assign({id}, next));
    if (res.status === 401) { forget(); throw new Error("code"); }
    if (!res.ok) throw new Error("save");
    setNote("");
  } catch (e) {
    statuses = Object.assign({}, statuses, {[id]: prev});
    setNote(e.message === "code" ? "가족 암호가 바뀌었습니다. 새 암호를 다시 입력해 주세요." : "저장하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요.");
  }
  saving.delete(id); render();
}

function post(body){
  return fetch("/api/books", { method: "POST", headers: { "content-type": "application/json", "x-family-code": code }, body: JSON.stringify(body) });
}
function forget(){ code = ""; try { localStorage.removeItem(CODE_KEY); } catch (e) {} }

$("lock").addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("code").value.trim(); if (!v) return;
  code = v;
  try {
    const res = await post({verify: true});
    if (res.ok) { try { localStorage.setItem(CODE_KEY, v); } catch (e) {} $("code").value = ""; setNote("확인되었습니다. 이제 이 기기에서 체크할 수 있습니다."); }
    else { forget(); setNote(res.status === 401 ? "암호가 맞지 않습니다. 다시 확인해 주세요." : "확인하지 못했습니다. 잠시 후 다시 시도해 주세요."); }
  } catch (err) { forget(); setNote("확인하지 못했습니다. 인터넷 연결을 확인해 주세요."); }
  render();
});
$("relock").addEventListener("click", () => { forget(); setNote(""); render(); });

$("list").addEventListener("click", e => { const b = e.target.closest(".seg button"); if (b && !b.disabled) choose(b.dataset.id, b.dataset.v); });
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { tab = t.dataset.tab; render(); }));
document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => { filter = ch.dataset.f; render(); }));

render();

// Load records, then refresh every 30 s while the page is visible so family members see each other's checks.
async function load(){
  if (saving.size) return;
  try {
    const res = await fetch("/api/books", { cache: "no-store" });
    if (!res.ok) throw new Error();
    const data = await res.json();
    if (saving.size) return;
    statuses = data.statuses || {};
    if (!loaded) setNote("");
    loaded = true;
  } catch (e) {
    if (!loaded) { loaded = true; setNote("저장된 기록을 불러오지 못했습니다. 잠시 후 다시 열어 주세요."); }
  }
  render();
}
try { lucide.createIcons({ attrs: { "stroke-width": 1.75 } }); } catch (e) {}
load();
setInterval(() => { if (document.visibilityState === "visible") load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
</script>
